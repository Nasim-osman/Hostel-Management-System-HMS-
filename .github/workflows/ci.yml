name: HMS Continuous Integration Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Environment Configuration
        run: |
          cp .env.example .env

      - name: Run Django System Checks
        run: |
          python manage.py check

      - name: Check for Unapplied or Missing Migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Execute Automated Test Suite (Unit, Integration & RBAC)
        run: |
          python manage.py test --verbosity=2

      - name: Test Automated Reminders & Backup Administrative Commands
        run: |
          python manage.py send_reminders
          python manage.py backup_db
