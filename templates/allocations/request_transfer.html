{% extends 'base.html' %}

{% block title %}Request Room Transfer — HMS{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div>
        <a href="{% url 'allocations:transfer_list' %}" class="text-xs text-blue-600 hover:underline">&larr; Back to Transfers</a>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900 mt-1">Request Room Transfer</h1>
        <p class="text-xs text-gray-500">Currently allocated bed: <span class="font-bold text-gray-800">{{ current_bed }}</span></p>
    </div>

    <div class="hms-card">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Target Room Preference (Optional)</label>
                {{ form.target_room }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Reason for Transfer</label>
                {{ form.reason }}
            </div>

            <div class="pt-4 border-t border-gray-100 flex items-center justify-end space-x-2">
                <a href="{% url 'allocations:transfer_list' %}" class="px-4 py-2 border border-gray-300 rounded text-xs font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-[#0060af] hover:bg-[#005096] text-white text-xs font-semibold rounded">Submit Request</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
