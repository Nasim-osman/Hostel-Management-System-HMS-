{% extends 'base.html' %}

{% block title %}{{ action }} — HMS{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div>
        <a href="{% url 'notices:notice_list' %}" class="text-xs text-blue-600 hover:underline">&larr; Back to Notices</a>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900 mt-1">{{ action }}</h1>
    </div>

    <div class="hms-card">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Notice Headline</label>
                {{ form.title }}
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Category</label>
                    {{ form.category }}
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Target Audience</label>
                    {{ form.target_audience }}
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Notice Content</label>
                {{ form.content }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Expiry Date (Optional)</label>
                {{ form.expiry_date }}
            </div>
            <div class="flex items-center space-x-2 pt-2">
                {{ form.is_published }}
                <label class="text-xs font-medium text-gray-700">Publish immediately to students</label>
            </div>

            <div class="pt-4 border-t border-gray-100 flex items-center justify-end space-x-2">
                <a href="{% url 'notices:notice_list' %}" class="px-4 py-2 border border-gray-300 rounded text-xs font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-[#0060af] hover:bg-[#005096] text-white text-xs font-semibold rounded shadow-sm">Save Notice</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
