{% extends 'base.html' %}

{% block title %}Issue Penalty Fine — HMS{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div>
        <a href="{% url 'finance:fine_list' %}" class="text-xs text-blue-600 hover:underline">&larr; Back to Fines</a>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900 mt-1">Issue Disciplinary Fine</h1>
    </div>

    <div class="hms-card">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Resident</label>
                {{ form.resident }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Reason for Penalty</label>
                {{ form.reason }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Penalty Amount (₹)</label>
                {{ form.amount }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Notes / Policy Citation</label>
                {{ form.notes }}
            </div>

            <div class="pt-4 border-t border-gray-100 flex items-center justify-end space-x-2">
                <a href="{% url 'finance:fine_list' %}" class="px-4 py-2 border border-gray-300 rounded text-xs font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded shadow-sm">Issue Fine</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
